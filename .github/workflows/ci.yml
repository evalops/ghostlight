---
name: CI

"on":
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ghostlight-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: License and prose hygiene
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Run repository hygiene check
        run: bash scripts/check-repo-hygiene.sh

      - name: Run repository-script tests
        run: bash scripts/test-repo-hygiene.sh

      - name: Enforce immutable image and action references
        run: |
          set -euo pipefail
          bash scripts/test-image-safety.sh
          bash scripts/test-browser-update-workflow.sh
          bash scripts/check-image-safety.sh

  shell-and-compose:
    name: Shell and Compose checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install ShellCheck when script directories exist
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d scripts && ! -d runtime ]]; then
            echo "Required scripts/ and runtime/ inputs are missing." >&2
            exit 1
          fi

          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes shellcheck
          fi

      - name: Run ShellCheck
        run: bash scripts/check-shell.sh

      - name: Validate Docker Compose files without starting containers
        shell: bash
        run: |
          set -euo pipefail
          cp runtime/.env.example runtime/.env
          chmod 600 runtime/.env
          compose_files=()
          if [[ -d runtime ]]; then
            while IFS= read -r -d '' file; do
              compose_files+=("$file")
            done < <(
              find runtime -type f \( \
                -name 'compose.yml' -o \
                -name 'compose.yaml' -o \
                -name 'docker-compose.yml' -o \
                -name 'docker-compose.yaml' \
              \) -print0
            )
          fi

          if (( ${#compose_files[@]} == 0 )); then
            echo "Required Docker Compose file is missing under runtime/." >&2
            exit 1
          fi

          for file in "${compose_files[@]}"; do
            echo "Validating $file"
            docker compose -f "$file" config --quiet
          done

      - name: Run runtime regression tests
        run: bash runtime/tests/test_runtime.sh

      - name: Validate flag-free root Compose entrypoint
        run: |
          cp runtime/.env.example runtime/.env
          docker compose config --quiet

  go-tests:
    name: Go tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Go
        # actions/setup-go v6.1.0
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c
        with:
          go-version-file: control/go.mod
          cache-dependency-path: control/go.mod

      - name: Check Go formatting
        working-directory: control
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            printf 'gofmt required for:\n%s\n' "$unformatted" >&2
            exit 1
          fi

      - name: Run control tests
        working-directory: control
        run: |
          set -euo pipefail
          go test ./...
          go test -race ./...
          go vet ./...

  browser-agent-tests:
    name: Browser agent tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c
        with:
          go-version-file: viewer/bridge/go.mod
          cache-dependency-path: viewer/bridge/go.mod

      - name: Verify native messaging host
        working-directory: viewer/bridge
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            printf 'gofmt required for:\n%s\n' "$unformatted" >&2
            exit 1
          fi
          go test ./...
          go test -race ./...
          go vet ./...

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"

      - name: Verify Manifest V3 agent
        working-directory: viewer/extension
        run: |
          npm test
          node --check service-worker.js
          node --check protocol.js

      - name: Verify Chrome continuity companion
        working-directory: companion/chrome
        run: |
          npm test
          node --check service-worker.js
          node --check options.js
          node --check popup.js
          node --check sync-core.js

  swift-tests:
    name: Swift tests
    runs-on: macos-14
    steps:
      - name: Check out source
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Run macOS tests
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f macos/Package.swift ]]; then
            swift test --package-path macos
            exit 0
          fi

          shopt -s nullglob
          workspaces=(macos/*.xcworkspace)
          projects=(macos/*.xcodeproj)

          if (( ${#workspaces[@]} > 0 )); then
            workspace=${workspaces[0]}
            scheme=${XCODE_SCHEME:-}
            if [[ -z "$scheme" ]]; then
              scheme=$(
                xcodebuild -list -json -workspace "$workspace" |
                  plutil -extract \
                    workspace.schemes.0 raw -o - - 2>/dev/null || true
              )
            fi
            if [[ -z "$scheme" ]]; then
              echo "No Xcode scheme found for $workspace; set XCODE_SCHEME." >&2
              exit 1
            fi
            xcodebuild test \
              -workspace "$workspace" \
              -scheme "$scheme" \
              -destination 'platform=macOS'
            exit 0
          fi

          if (( ${#projects[@]} > 0 )); then
            project=${projects[0]}
            scheme=${XCODE_SCHEME:-}
            if [[ -z "$scheme" ]]; then
              scheme=$(
                xcodebuild -list -json -project "$project" |
                  plutil -extract \
                    project.schemes.0 raw -o - - 2>/dev/null || true
              )
            fi
            if [[ -z "$scheme" ]]; then
              echo "No Xcode scheme found for $project; set XCODE_SCHEME." >&2
              exit 1
            fi
            xcodebuild test \
              -project "$project" \
              -scheme "$scheme" \
              -destination 'platform=macOS'
            exit 0
          fi

          echo "macos/ has no Package.swift, Xcode workspace, or Xcode project."
          exit 1

      - name: Build the Ghostlight app bundle
        run: |
          macos/package-app.sh
          test -x macos/.build/Ghostlight.app/Contents/MacOS/GhostlightApp
          test "$(plutil -extract CFBundleIdentifier raw -o - macos/.build/Ghostlight.app/Contents/Info.plist)" = "org.evalops.Ghostlight"
          test "$(plutil -extract NSAppTransportSecurity.NSAllowsLocalNetworking raw -o - macos/.build/Ghostlight.app/Contents/Info.plist)" = "true"
          test -n "$(plutil -extract NSCameraUsageDescription raw -o - macos/.build/Ghostlight.app/Contents/Info.plist)"
          test -n "$(plutil -extract NSMicrophoneUsageDescription raw -o - macos/.build/Ghostlight.app/Contents/Info.plist)"
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.device.camera' macos/Resources/Ghostlight.entitlements)" = "true"
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.device.audio-input' macos/Resources/Ghostlight.entitlements)" = "true"
          if plutil -extract NSAppTransportSecurity.NSAllowsArbitraryLoadsInWebContent raw -o - macos/.build/Ghostlight.app/Contents/Info.plist >/dev/null 2>&1; then
            echo "NSAppTransportSecurity.NSAllowsArbitraryLoadsInWebContent must not be set" >&2
            exit 1
          fi

      - name: Build and verify the universal release archive
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$(mktemp -d)"
          receipt_dir="$(mktemp -d)"
          trap 'rm -rf -- "$release_dir" "$receipt_dir"' EXIT
          macos/package-release.sh "$release_dir"
          (cd "$release_dir" && shasum -a 256 --check SHA256SUMS)
          shopt -s nullglob
          archives=("$release_dir"/Ghostlight-*-macos-universal.zip)
          [[ ${#archives[@]} == 1 ]]
          ditto -x -k "${archives[0]}" "$receipt_dir"
          codesign --verify --deep --strict "$receipt_dir/Ghostlight.app"
          architectures="$(lipo -archs "$receipt_dir/Ghostlight.app/Contents/MacOS/GhostlightApp")"
          [[ "$architectures" == *arm64* ]]
          [[ "$architectures" == *x86_64* ]]

  deterministic-harnesses:
    name: Deterministic harnesses
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Require the acceptance and performance harness inputs
        shell: bash
        run: |
          set -euo pipefail
          required=(
            tests/acceptance/package.json
            tests/acceptance/package-lock.json
            tests/acceptance/persistence.mjs
            tests/acceptance/performance.mjs
            tests/acceptance/run-linux-persistence.sh
            tests/acceptance/test_validate_persistence.py
            tests/acceptance/test_verify_browser_agent.py
            tests/acceptance/validate-persistence.py
            tests/acceptance/verify-browser-agent.py
            tests/acceptance/test_audit_screenshots.py
            tests/acceptance/fixtures/chromium-cdp-flags
            tests/acceptance/fixtures/cdp_proxy.conf
            tests/acceptance/fixtures/cdp_proxy.py
            tests/acceptance/fixtures/synthetic_server.conf
            tests/acceptance/fixtures/synthetic_server.py
            tools/collect-performance.sh
            tools/test-macos-relaunch.sh
          )
          for path in "${required[@]}"; do
            test -s "$path"
          done

      - name: Set up Node.js
        # actions/setup-node v4.4.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tests/acceptance/package-lock.json

      - name: Install the locked Playwright harness
        run: npm ci --ignore-scripts --prefix tests/acceptance

      - name: Install screenshot OCR dependency
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes tesseract-ocr

      - name: Validate harness syntax and CLI failure contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check tests/acceptance/persistence.mjs
          node --check tests/acceptance/performance.mjs
          python3 -m py_compile tests/acceptance/audit-screenshots.py tests/acceptance/fixtures/synthetic_server.py tests/acceptance/test_validate_persistence.py tests/acceptance/test_verify_browser_agent.py tests/acceptance/validate-persistence.py tests/acceptance/verify-browser-agent.py
          if node tests/acceptance/persistence.mjs; then
            echo "persistence harness accepted missing arguments" >&2
            exit 1
          fi
          if node tests/acceptance/performance.mjs; then
            echo "performance harness accepted missing arguments" >&2
            exit 1
          fi
          python3 tests/acceptance/test_audit_screenshots.py
          python3 tests/acceptance/test_validate_persistence.py
          python3 tests/acceptance/test_verify_browser_agent.py

      - name: Run performance harness self-tests
        shell: bash
        run: |
          set -euo pipefail
          node tools/measure-streaming-performance.mjs --self-test
          node tools/test-evaluate-recovery.mjs
          node tools/test-build-readiness-ledger.mjs
          node tools/build-readiness-ledger.mjs docs/readiness/evidence.json /tmp/ghostlight-readiness-ledger.json
          cmp docs/readiness/ledger.json /tmp/ghostlight-readiness-ledger.json
          node tools/test-evaluate-native-performance.mjs
          node tools/test-evaluate-codec-pair.mjs
          bash tools/test-native-performance-processes.sh
          node tests/acceptance/performance.mjs --self-test

      - name: Run deterministic harness and recovery checks
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes ripgrep
          fi
          bash scripts/test-container-pins.sh
          bash runtime/tests/test_profile_backup.sh
          mapfile -d '' screenshots < <(find docs/acceptance -type f \( -name '*.png' -o -name '*.jpg' \) -print0)
          (( ${#screenshots[@]} > 0 ))
          python3 tests/acceptance/audit-screenshots.py "${screenshots[@]}"

      - name: Upload committed acceptance evidence audit
        if: always()
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: committed-acceptance-evidence-audit-${{ github.sha }}
          path: |
            tests/acceptance/package-lock.json
            docs/acceptance/2026-08-12/
            docs/readiness/
          if-no-files-found: warn
          retention-days: 14
