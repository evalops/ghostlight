services:
  viewer:
    # Source: https://github.com/m1k1o/neko
    # License: Apache-2.0 for the Neko repository; image dependencies retain their own notices.
    image: "${NEKO_IMAGE:-ghcr.io/m1k1o/neko/chromium@sha256:a79093411aced75b3ed7110d50ec9082f9933afabd6592254f01c383678082e7}"
    init: true
    hostname: ghostlight-chromium
    restart: unless-stopped
    shm_size: "2gb"
    ports:
      - target: 8080
        published: "${VIEWER_PORT:-8081}"
        host_ip: "${GHOSTLIGHT_BIND_ADDRESS:?set GHOSTLIGHT_BIND_ADDRESS to a private host interface}"
        protocol: tcp
      - target: "${WEBRTC_MUX_PORT:-52000}"
        published: "${WEBRTC_MUX_PORT:-52000}"
        host_ip: "${GHOSTLIGHT_BIND_ADDRESS:?set GHOSTLIGHT_BIND_ADDRESS to a private host interface}"
        protocol: udp
      - target: "${WEBRTC_MUX_PORT:-52000}"
        published: "${WEBRTC_MUX_PORT:-52000}"
        host_ip: "${GHOSTLIGHT_BIND_ADDRESS:?set GHOSTLIGHT_BIND_ADDRESS to a private host interface}"
        protocol: tcp
    volumes:
      - "${CHROMIUM_PROFILE_DIR:-./data/chromium}:/home/neko/.config/chromium"
      - "./chromium-policy.json:/etc/chromium/policies/managed/policies.json:ro"
    environment:
      NEKO_DESKTOP_SCREEN: "${NEKO_DESKTOP_SCREEN:-1920x1080@30}"
      NEKO_MEMBER_MULTIUSER_USER_PASSWORD: "${NEKO_USER_PASSWORD:-__GENERATE_AT_INSTALL__}"
      NEKO_MEMBER_MULTIUSER_ADMIN_PASSWORD: "${NEKO_ADMIN_PASSWORD:-__GENERATE_AT_INSTALL__}"
      NEKO_WEBRTC_UDPMUX: "${NEKO_WEBRTC_UDPMUX:-52000}"
      NEKO_WEBRTC_TCPMUX: "${NEKO_WEBRTC_TCPMUX:-52000}"
      NEKO_WEBRTC_ICELITE: "${NEKO_WEBRTC_ICELITE:-0}"
      NEKO_WEBRTC_NAT1TO1: "${NEKO_WEBRTC_NAT1TO1:-127.0.0.1}"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12

  control:
    build:
      context: ../control
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    ports:
      - target: 8080
        published: "${CONTROL_PORT:-8080}"
        host_ip: "${GHOSTLIGHT_BIND_ADDRESS:?set GHOSTLIGHT_BIND_ADDRESS to a private host interface}"
        protocol: tcp
    environment:
      GHOSTLIGHT_LISTEN_ADDR: "0.0.0.0:8080"
      GHOSTLIGHT_VIEWER_URL: "${GHOSTLIGHT_VIEWER_URL:-http://127.0.0.1:8081}"
      GHOSTLIGHT_VIEWER_HEALTH_URL: "${GHOSTLIGHT_VIEWER_HEALTH_URL:-http://viewer:8080}"
    depends_on:
      viewer:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 12
    # Control contract: GET /v1/viewer returns the configured viewer URL.
