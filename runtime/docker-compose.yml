services:
  viewer:
    # Source and modifications: ../viewer/Dockerfile and ../viewer/neko-go-modules.patch
    # License: Apache-2.0 for Neko; image dependencies retain their own notices.
    image: "${NEKO_IMAGE:-ghcr.io/evalops/ghostlight-viewer@sha256:fe135f3553502c1f057fb707c8e9731220d7321376f2eff84b84b4f02a0f7280}"
    init: true
    hostname: ghostlight-chromium
    restart: unless-stopped
    shm_size: "2gb"
    pids_limit: 512
    # Must exceed shm_size: the 2gb /dev/shm tmpfs counts toward the memory limit.
    mem_limit: 4gb
    ports:
      - target: 8080
        published: "${VIEWER_PORT:-8081}"
        host_ip: "${GHOSTLIGHT_BIND_ADDRESS:?set GHOSTLIGHT_BIND_ADDRESS to a private host interface}"
        protocol: tcp
      - target: "${WEBRTC_MUX_PORT:-52000}"
        published: "${WEBRTC_MUX_PORT:-52000}"
        host_ip: "${GHOSTLIGHT_BIND_ADDRESS:?set GHOSTLIGHT_BIND_ADDRESS to a private host interface}"
        protocol: udp
      - target: "${WEBRTC_MUX_PORT:-52000}"
        published: "${WEBRTC_MUX_PORT:-52000}"
        host_ip: "${GHOSTLIGHT_BIND_ADDRESS:?set GHOSTLIGHT_BIND_ADDRESS to a private host interface}"
        protocol: tcp
    volumes:
      - "${CHROMIUM_PROFILE_DIR:-./data/chromium}:/home/neko/.config/chromium"
      - "./chromium-policy.json:/etc/chromium/policies/managed/policies.json:ro"
      - ghostlight-downloads:/home/neko/Downloads
    environment:
      # Neko defaults to container-local loopback; control readiness uses the private Compose network.
      NEKO_SERVER_BIND: "0.0.0.0:8080"
      NEKO_DESKTOP_SCREEN: "${NEKO_DESKTOP_SCREEN:-1920x1080@30}"
      # Neko forces VP8 when no capture pipeline is configured, so H.264 needs both the
      # codec and a matching pipeline. VP8 revert: NEKO_CAPTURE_VIDEO_CODEC=vp8 plus an
      # empty NEKO_CAPTURE_VIDEO_PIPELINE (the upstream default VP8 pipeline is implicit).
      # The pipeline framerate cap must match NEKO_DESKTOP_SCREEN; both default to 30.
      NEKO_CAPTURE_VIDEO_CODEC: "${NEKO_CAPTURE_VIDEO_CODEC:-h264}"
      NEKO_CAPTURE_VIDEO_PIPELINE: "${NEKO_CAPTURE_VIDEO_PIPELINE-ximagesrc display-name={display} show-pointer=false use-damage=false ! video/x-raw,framerate=30/1 ! videoconvert ! queue ! video/x-raw,format=NV12 ! x264enc name=encoder threads=4 bitrate=3072 key-int-max=60 vbv-buf-capacity=3072 byte-stream=true tune=zerolatency speed-preset=veryfast ! h264parse config-interval=1 ! video/x-h264,stream-format=byte-stream,profile=constrained-baseline ! appsink name=appsink}"
      NEKO_MEMBER_MULTIUSER_USER_PASSWORD: "${NEKO_USER_PASSWORD:?generate NEKO_USER_PASSWORD and set it in runtime/.env}"
      NEKO_MEMBER_MULTIUSER_ADMIN_PASSWORD: "${NEKO_ADMIN_PASSWORD:?generate NEKO_ADMIN_PASSWORD and set it in runtime/.env}"
      NEKO_WEBRTC_UDPMUX: "${NEKO_WEBRTC_UDPMUX:-52000}"
      NEKO_WEBRTC_TCPMUX: "${NEKO_WEBRTC_TCPMUX:-52000}"
      NEKO_WEBRTC_ICELITE: "${NEKO_WEBRTC_ICELITE:-1}"
      NEKO_WEBRTC_NAT1TO1: "${NEKO_WEBRTC_NAT1TO1:-127.0.0.1}"
      GHOSTLIGHT_CONTROL_INTERNAL_URL: "http://control:8080"
      GHOSTLIGHT_BRIDGE_TOKEN: "${GHOSTLIGHT_BRIDGE_TOKEN:?generate GHOSTLIGHT_BRIDGE_TOKEN in runtime/.env}"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12

  control:
    build:
      context: ../control
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    pids_limit: 128
    mem_limit: 256m
    ports:
      - target: 8080
        published: "${CONTROL_PORT:-8080}"
        host_ip: "${GHOSTLIGHT_BIND_ADDRESS:?set GHOSTLIGHT_BIND_ADDRESS to a private host interface}"
        protocol: tcp
    environment:
      GHOSTLIGHT_LISTEN_ADDR: "0.0.0.0:8080"
      GHOSTLIGHT_VIEWER_URL: "${GHOSTLIGHT_VIEWER_URL:-http://127.0.0.1:8081}"
      GHOSTLIGHT_VIEWER_HEALTH_URL: "${GHOSTLIGHT_VIEWER_HEALTH_URL:-http://viewer:8080}"
      GHOSTLIGHT_STATE_DIR: "/var/lib/ghostlight/state"
      GHOSTLIGHT_ATTACHMENT_DIR: "/var/lib/ghostlight/attachments"
      GHOSTLIGHT_API_TOKEN: "${GHOSTLIGHT_API_TOKEN:?generate GHOSTLIGHT_API_TOKEN in runtime/.env}"
      GHOSTLIGHT_BRIDGE_TOKEN: "${GHOSTLIGHT_BRIDGE_TOKEN:?generate GHOSTLIGHT_BRIDGE_TOKEN in runtime/.env}"
      GHOSTLIGHT_LEASE_TTL_SECONDS: "${GHOSTLIGHT_LEASE_TTL_SECONDS:-30}"
    volumes:
      - ghostlight-control-state:/var/lib/ghostlight/state
      - ghostlight-control-attachments:/var/lib/ghostlight/attachments
    depends_on:
      viewer:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 12
    # Control contract: GET /v1/viewer returns the configured viewer URL.

volumes:
  ghostlight-control-state:
  ghostlight-control-attachments:
  ghostlight-downloads:
