[program:ghostlight-synthetic-server]
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s"
command=/usr/bin/python3 /usr/local/bin/ghostlight-synthetic-server.py
autorestart=true
priority=100
user=%(ENV_USER)s
stdout_logfile=/var/log/neko/ghostlight-synthetic-server.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
redirect_stderr=true
