agents:
  queue: "hetzner-linux-medium"
  image: "evalops-platform-ci-v3"

env:
  CI: "true"

steps:
  - group: ":linux: Linux validation"
    steps:
      - label: ":broom: Repository hygiene"
        key: "hygiene"
        timeout_in_minutes: 20
        command: |
          bash scripts/check-repo-hygiene.sh
          bash scripts/test-repo-hygiene.sh
          bash scripts/test-image-safety.sh
          bash scripts/test-browser-update-workflow.sh
          bash scripts/check-image-safety.sh

      - label: ":docker: Shell, Compose, and runtime"
        key: "runtime"
        timeout_in_minutes: 45
        command: |
          set -euo pipefail
          command -v shellcheck >/dev/null
          bash scripts/check-shell.sh
          cp runtime/.env.example runtime/.env
          find runtime -type f \( -name 'compose.yml' -o -name 'compose.yaml' -o -name 'docker-compose.yml' -o -name 'docker-compose.yaml' \) -print0 | while IFS= read -r -d '' file; do docker compose -f "$$file" config --quiet; done
          bash runtime/tests/test_runtime.sh
          docker compose config --quiet

      - label: ":go: Go control and browser bridge"
        key: "go-tests"
        timeout_in_minutes: 45
        command: |
          set -euo pipefail
          go_archive="$$(mktemp)"
          go_root="$$(mktemp -d)"
          cleanup() {
            rm -f "$$go_archive"
            rm -rf "$$go_root"
          }
          trap cleanup EXIT
          curl --fail --location --silent --show-error \
            https://go.dev/dl/go1.26.6.linux-amd64.tar.gz \
            --output "$$go_archive"
          printf '%s  %s\n' \
            708effb774be8237570d0add163225abbdfaf4fca28b2611df167beba4feef89 \
            "$$go_archive" | sha256sum --check --status
          tar -C "$$go_root" -xzf "$$go_archive"
          export PATH="$$go_root/go/bin:$$PATH"
          for module in control viewer/bridge; do
            (cd "$$module" && test -z "$$(gofmt -l .)" && go test ./... && go test -race ./... && go vet ./...)
          done

      - label: ":chrome: Browser surfaces"
        key: "browser-tests"
        timeout_in_minutes: 30
        command: |
          set -euo pipefail
          for package in viewer/extension companion/chrome; do
            (cd "$$package" && npm test)
          done
          node --check viewer/extension/service-worker.js
          node --check viewer/extension/protocol.js
          node --check companion/chrome/service-worker.js
          node --check companion/chrome/options.js
          node --check companion/chrome/popup.js
          node --check companion/chrome/sync-core.js

      - label: ":test_tube: Deterministic harnesses"
        key: "harnesses"
        timeout_in_minutes: 60
        command: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes tesseract-ocr
          npm ci --ignore-scripts --prefix tests/acceptance
          command -v tesseract >/dev/null
          node --check tests/acceptance/persistence.mjs
          node --check tests/acceptance/performance.mjs
          python3 -m py_compile tests/acceptance/audit-screenshots.py tests/acceptance/fixtures/synthetic_server.py tests/acceptance/test_validate_persistence.py tests/acceptance/test_verify_browser_agent.py tests/acceptance/validate-persistence.py tests/acceptance/verify-browser-agent.py
          python3 tests/acceptance/test_audit_screenshots.py
          python3 tests/acceptance/test_validate_persistence.py
          python3 tests/acceptance/test_verify_browser_agent.py
          node tools/measure-streaming-performance.mjs --self-test
          node tools/test-evaluate-recovery.mjs
          node tools/test-build-readiness-ledger.mjs
          node tools/build-readiness-ledger.mjs docs/readiness/evidence.json /tmp/ghostlight-readiness-ledger.json
          cmp docs/readiness/ledger.json /tmp/ghostlight-readiness-ledger.json
          node tools/test-evaluate-native-performance.mjs
          node tools/test-evaluate-codec-pair.mjs
          bash tools/test-native-performance-processes.sh
          node tests/acceptance/performance.mjs --self-test
          bash scripts/test-container-pins.sh
          bash runtime/tests/test_profile_backup.sh

  - block: ":no_entry: macOS CI is dormant"
    key: "macos-dormant"
    if: build.env("GHOSTLIGHT_ENABLE_MACOS_CI") != "true"
    prompt: "macOS validation is intentionally dormant until a self-hosted Mac runner is provisioned. Set GHOSTLIGHT_ENABLE_MACOS_CI=true only for an explicitly authorized hosted run."

  - label: ":apple: macOS app, tests, and universal archive"
    key: "macos"
    if: build.env("GHOSTLIGHT_ENABLE_MACOS_CI") == "true"
    timeout_in_minutes: 90
    agents:
      queue: "macos-large"
    command: |
      set -euo pipefail
      swift test --package-path macos
      macos/package-app.sh
      test -x macos/.build/Ghostlight.app/Contents/MacOS/GhostlightApp
      test "$$(plutil -extract CFBundleIdentifier raw -o - macos/.build/Ghostlight.app/Contents/Info.plist)" = "org.evalops.Ghostlight"
      release_dir="$$(mktemp -d)"
      receipt_dir="$$(mktemp -d)"
      trap 'rm -rf -- "'"'"$$release_dir"'"'" "'"'"$$receipt_dir"'"'"' EXIT
      macos/package-release.sh "$$release_dir"
      (cd "$$release_dir" && shasum -a 256 --check SHA256SUMS)
      archive="$$(find "$$release_dir" -maxdepth 1 -name 'Ghostlight-*-macos-universal.zip' -print -quit)"
      test -n "$$archive"
      ditto -x -k "$$archive" "$$receipt_dir"
      codesign --verify --deep --strict "$$receipt_dir/Ghostlight.app"
      architectures="$$(lipo -archs "$$receipt_dir/Ghostlight.app/Contents/MacOS/GhostlightApp")"
      [[ "$$architectures" == *arm64* && "$$architectures" == *x86_64* ]]
