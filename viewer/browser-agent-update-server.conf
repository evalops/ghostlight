[program:ghostlight-browser-agent-update-server]
command=/usr/bin/python3 -m http.server 18084 --bind 127.0.0.1 --directory /opt/ghostlight
autorestart=true
priority=700
user=%(ENV_USER)s
stdout_logfile=/var/log/neko/ghostlight-browser-agent-update-server.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true
