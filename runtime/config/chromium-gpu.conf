# Experimental GPU variant of the baked-in /etc/neko/supervisord/chromium.conf.
# Mounted by runtime/docker-compose.gpu.yml. Mirrors the upstream Neko
# apps/chromium/supervisord.nvidia.conf flag set: drops --disable-gpu and
# enables Vulkan/Skia/VA-API paths. See docs/gpu-acceleration.md.
[program:chromium]
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s",DISPLAY="%(ENV_DISPLAY)s",XDG_CONFIG_HOME="/tmp/ghostlight-chromium/config",XDG_CACHE_HOME="/tmp/ghostlight-chromium/cache"
command=/usr/local/bin/ghostlight-chromium
  --enable-remote-extensions
  --no-sandbox
  --window-position=0,0
  --display=%(ENV_DISPLAY)s
  --user-data-dir=/home/neko/.config/chromium
  --no-first-run
  --start-maximized
  --bwsi
  --force-dark-mode
  --disable-file-system
  --ignore-gpu-blocklist
  --enable-features=Vulkan,UseSkiaRenderer,VaapiVideoEncoder,VaapiVideoDecoder,CanvasOopRasterization
  --use-angle=vulkan
  --disable-vulkan-surface
  --enable-unsafe-webgpu
  --disable-software-rasterizer
  --disable-dev-shm-usage
stopsignal=INT
autorestart=true
priority=800
user=%(ENV_USER)s
stdout_logfile=/var/log/neko/chromium.log
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=10
redirect_stderr=true

[program:openbox]
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s",DISPLAY="%(ENV_DISPLAY)s"
command=/usr/bin/openbox --config-file /etc/neko/openbox.xml
autorestart=true
priority=300
user=%(ENV_USER)s
stdout_logfile=/var/log/neko/openbox.log
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=10
redirect_stderr=true
